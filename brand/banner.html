<!doctype html><html><head><meta charset="utf-8"><style>@font-face { font-family:'Plus Jakarta Sans'; src:url('fonts/plus-jakarta-sans-latin-800-normal.woff2') format('woff2'); font-weight:800; }
  @font-face { font-family:'Plus Jakarta Sans'; src:url('fonts/plus-jakarta-sans-latin-500-normal.woff2') format('woff2'); font-weight:500; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1500px; height:500px; overflow:hidden; font-family:'Plus Jakarta Sans',sans-serif; }
  body {
    background:
      radial-gradient(circle at 78% 28%, rgba(250,204,21,.95) 0 128px, rgba(250,204,21,0) 132px),
      radial-gradient(circle at 12% 108%, #4f46e5 0 420px, rgba(79,70,229,0) 430px),
      linear-gradient(120deg, #2563EB 0%, #3b5bdb 34%, #a21caf 68%, #EC4899 100%);
    color:#fff; position:relative; }
  /* soft big blob behind hero art */
  .blob { position:absolute; right:60px; top:-90px; width:640px; height:640px; border-radius:50%;
    background:rgba(255,255,255,.14); }
  .blob2 { position:absolute; right:300px; top:150px; width:380px; height:380px; border-radius:50%;
    background:rgba(255,255,255,.10); }

  .wordmark { position:absolute; left:70px; top:26px; font-weight:800; font-size:22px; letter-spacing:.16em;
    background:#101522; color:#fff; padding:9px 18px; border-radius:999px;
    box-shadow:0 8px 0 rgba(0,0,0,.22), 0 18px 36px rgba(0,0,0,.28); }
  .wordmark .track { color:#FACC15; margin-left:8px; }

  .facts { position:absolute; left:292px; top:28px; display:flex; gap:10px; }
  .fact { font-weight:800; font-size:11.5px; letter-spacing:.12em; padding:9px 14px; border-radius:999px;
    box-shadow:0 7px 0 rgba(0,0,0,.18), 0 15px 30px rgba(0,0,0,.22); }
  .fact.y { background:#FACC15; color:#101522; transform:rotate(-1.6deg); }
  .fact.w { background:#fff; color:#101522; transform:rotate(1.2deg); }
  .fact.m { background:#101522; color:#fff; transform:rotate(-0.8deg); }

  .hero { position:absolute; left:70px; top:86px; width:880px; }
  .hero h1 { font-weight:800; font-size:52px; line-height:1.0; letter-spacing:-.025em;
    text-shadow:0 6px 0 rgba(16,21,34,.28), 0 26px 60px rgba(0,0,0,.35); }
  .hero h1 em { font-style:normal; color:#FACC15; }
  .hero .sub { margin-top:8px; font-weight:500; font-size:19px; color:rgba(255,255,255,.92);
    text-shadow:0 3px 12px rgba(0,0,0,.35); }

  /* hero art tile, app-icon treatment from the inspiration */
  .art { position:absolute; overflow:hidden;
    box-shadow:0 34px 0 rgba(16,21,34,.22), 0 70px 110px rgba(0,0,0,.38); }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .art.one { width:384px; height:384px; right:132px; top:52px; border-radius:76px; transform:rotate(-5deg);
    border:8px solid rgba(255,255,255,.95); }
  .art.two { width:196px; height:196px; right:486px; top:252px; border-radius:44px; transform:rotate(7deg);
    border:7px solid #FACC15; box-shadow:0 22px 0 rgba(16,21,34,.22), 0 44px 80px rgba(0,0,0,.35); }

  /* sticker sparkles */
  .sp { position:absolute; border-radius:50%; background:#fff; opacity:.92; }
  .s1 { width:16px; height:16px; right:88px; top:36px; }
  .s2 { width:11px; height:11px; right:560px; top:210px; background:#FACC15; }
  .s3 { width:14px; height:14px; right:64px; bottom:64px; background:#7dd3fc; }
  .s4 { width:9px; height:9px; right:420px; top:80px; }
  .star { position:absolute; right:520px; top:52px; width:54px; height:54px; background:#FACC15;
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    filter:drop-shadow(0 8px 0 rgba(16,21,34,.22)); transform:rotate(-12deg); }
  .zig { position:absolute; left:952px; top:410px; width:120px; height:26px;
    background:linear-gradient(90deg, transparent 0 8px, #fff 8px 22px, transparent 22px 32px, #fff 32px 46px, transparent 46px 56px, #fff 56px 70px, transparent 70px 80px, #fff 80px 94px, transparent 94px);
    transform:rotate(-6deg); opacity:.9; border-radius:8px; }</style></head><body><div class="blob"></div><div class="blob2"></div>
