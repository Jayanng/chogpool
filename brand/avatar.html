  <div class="chip">CHOG TRACK</div>
  <script src="three.min.js"></script>
  <script>
const W = 400, H = 400, SS = 2;
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
renderer.setSize(W * SS, H * SS, false);
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
camera.position.set(0, 1.0, 6.5);
camera.lookAt(0, 0.1, 0);

scene.add(new THREE.HemisphereLight(0xbfe0ff, 0x14213d, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(7, 11, 8); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.camera.left = -16; key.shadow.camera.right = 16;
key.shadow.camera.top = 16; key.shadow.camera.bottom = -16;
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9ec9ff, 1.1);
rim.position.set(-8, 5, -6); scene.add(rim);
const mag = new THREE.PointLight(0xEC4899, 160, 50); mag.position.set(-9, 3, 8); scene.add(mag);
const warm = new THREE.PointLight(0xffc36b, 130, 50); warm.position.set(11, -2, 7); scene.add(warm);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90),
  new THREE.ShadowMaterial({opacity: 0.5}));
ground.rotation.x = -Math.PI/2; ground.position.y = -2.6; ground.receiveShadow = true;
scene.add(ground);

function clay(color, extra) {
  return new THREE.MeshPhysicalMaterial(Object.assign({
    color, roughness: 0.28, metalness: 0.18, clearcoat: 1, clearcoatRoughness: 0.16
  }, extra || {}));
}

// two-tone minted gold coins: edge + face materials
const face = clay(0xFDE047, {metalness: 0.72, roughness: 0.18});
const edge = clay(0xD97706, {metalness: 0.8, roughness: 0.3});
for (let i = 0; i < 8; i++) {
  const r = 0.9 + Math.random() * 0.9;
  const coin = new THREE.Mesh(new THREE.CylinderGeometry(r, r, r * 0.2, 64), [edge, face, face]);
  coin.position.set(-9 + Math.random() * 21, -1.8 + Math.random() * 5.6, -5 + Math.random() * 7);
  coin.rotation.set(Math.random() * 1.1, Math.random() * Math.PI, Math.random() * 1.0 - 0.5);
  coin.castShadow = true; coin.receiveShadow = true;
  scene.add(coin);
  // embossed inner ring
  const inner = new THREE.Mesh(new THREE.TorusGeometry(r * 0.62, r * 0.07, 24, 64), clay(0xFFF7CC, {metalness: 0.75, roughness: 0.15}));
  inner.position.copy(coin.position);
  inner.rotation.copy(coin.rotation);
  inner.translateY(r * 0.12);
  inner.castShadow = true;
  scene.add(inner);
}

const tiles = [
  {g: [2.9, 2.9, 0.5], c: 0x2563EB, p: [-7.6, -0.7, -2.6], r: [0.12, 0.5, -0.14]},
  {g: [1.9, 1.9, 0.42], c: 0xEC4899, p: [-4.8, 2.6, -3.8], r: [0.3, -0.4, 0.22]},
  {g: [1.35, 1.35, 0.34], c: 0xFACC15, p: [-2.8, -2.0, -1.0], r: [-0.2, 0.3, 0.3]},
  {g: [1.6, 1.6, 0.36], c: 0x7dd3fc, p: [9.2, 3.3, -6.5], r: [0.25, -0.3, -0.2]},
];
for (const t of tiles) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(t.g[0], t.g[1], t.g[2]), clay(t.c));
  m.position.set(t.p[0], t.p[1], t.p[2]);
  m.rotation.set(t.r[0], t.r[1], t.r[2]);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
}
const ball = new THREE.Mesh(new THREE.SphereGeometry(1.25, 64, 64), clay(0x7dd3fc, {roughness: 0.12, metalness: 0.3}));
ball.position.set(-11, 2.6, -6); ball.castShadow = true; scene.add(ball);

for (let i = 0; i < 10; i++) {
  const c = [0xEC4899, 0xFACC15, 0x7dd3fc, 0x22c55e][i % 4];
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.12 + Math.random() * 0.14, 24, 24),
    new THREE.MeshBasicMaterial({color: c}));
  s.position.set(-12 + Math.random() * 24, -2 + Math.random() * 6.5, -6 + Math.random() * 8);
  scene.add(s);
}
renderer.render(scene, camera);
document.title = 'RENDERED';
</script></body></html>
