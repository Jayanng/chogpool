name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Forge build
        run: forge build
      - name: Forge test
        run: forge test -vvv
  addresses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify registry + no hardcoded addresses
        run: node infra/check-addresses.mjs
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Generate addresses module
        run: node infra/gen-addresses.mjs
      - name: Build web
        run: pnpm run build:web
      - name: Check fixtures excluded from production bundle
        run: node infra/check-fixtures.mjs
      - name: Build ui package
        run: pnpm --filter @chogpool/ui build
